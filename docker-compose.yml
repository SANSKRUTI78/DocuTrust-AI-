version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: docutrust_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: docutrust123
      MYSQL_DATABASE: docutrust_ai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docutrust_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://root:docutrust123@db:3306/docutrust_ai
      FRONTEND_URL: http://localhost:5173
    env_file:
      - ./backend/.env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docutrust_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
